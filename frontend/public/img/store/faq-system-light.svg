    <stop offset="1" stop-color="#eceff4"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#94a3b8"/>
    <stop offset="1" stop-color="#64748b"/>
  </linearGradient>
  <linearGradient id="accSoft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#94a3b8" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#94a3b8" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#64748b" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#64748b" stop-opacity="0"/>
  </radialGradient>
</defs>
