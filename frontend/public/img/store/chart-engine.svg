<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Chart Engine">
<style>
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ma{to{stroke-dashoffset:-120}}
@keyframes dr{0%{stroke-dashoffset:1000}100%{stroke-dashoffset:0}}
@keyframes be{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.62)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes px{0%,100%{transform:scaleX(.78)}50%{transform:scaleX(1)}}
@keyframes fk{0%,100%{transform:scaleY(1);opacity:.85}50%{transform:scaleY(1.22);opacity:1}}
.af{animation:fl 9s ease-in-out infinite}
.ap{animation:pu 6s ease-in-out infinite}
.ab{animation:bl 4s ease-in-out infinite}
.am{animation:ma 4.8s linear infinite}
.ad{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dr 10s ease-in-out infinite alternate}
.abe{transform-box:fill-box;transform-origin:center;animation:be 6s ease-in-out infinite}
.aq{transform-box:fill-box;transform-origin:center bottom;animation:eq 4s ease-in-out infinite}
.asp{transform-box:fill-box;transform-origin:center;animation:sp 30s linear infinite}
.apx{transform-box:fill-box;transform-origin:left center;animation:px 8s ease-in-out infinite}
.afk{transform-box:fill-box;transform-origin:center top;animation:fk 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.af,.ap,.ab,.am,.ad,.abe,.aq,.asp,.apx,.afk{animation:none}.ad{stroke-dashoffset:0}}
</style>
