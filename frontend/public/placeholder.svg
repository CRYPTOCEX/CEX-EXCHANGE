<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" fill="none">
<!--
  Referenced from 167 call sites — MORE than `/img/placeholder.svg` (125), and it
  was missed when that one was given a dark arm. It shipped as the stock v0
  placeholder: an `#EAEAEA` ground, light only. Against the dark page that is a
  near-white 1200x1200 rectangle on every card whose image failed to load — the
  identical defect that was fixed next door, in the file with fewer uses.

  The geometry below is untouched; only the colours were lifted into classes so
  they can respond to the scheme. Redrawing it would have changed the look of 167
  places nobody asked to change.

  WHY CLASSES AND LITERAL HEX, NOT TOKENS: this file is loaded through
  `<img src>` / next `<Image>`, so it is a SEPARATE DOCUMENT. The page's CSS
  custom properties do not cross that boundary and `currentColor` has nothing to
  inherit from, so an `hsl(var(...))` reference to a surface token cannot work
  here. That also makes this file one of the few things the admin design manager
  cannot retheme — see frontend/DESIGN-SYSTEM.md, Phase 18, "What the panel
  cannot reach".

  DO NOT WRITE A DOUBLE HYPHEN ANYWHERE IN THIS COMMENT. XML forbids `-` `-`
  inside a comment, so naming a CSS custom property literally (with its two
  leading hyphens) makes the whole file malformed and every browser renders the
  broken-image glyph instead of the placeholder — at all 167 call sites. Refer
  to the tokens by bare name.

  WHAT THIS TRACKS: `prefers-color-scheme` is the only theme signal an
  <img>-loaded SVG can read, and it reflects the OS setting — NOT the app's
  class-based `.dark` toggle. A viewer whose OS is light while the app is set to
  dark still gets the light arm. The only complete fix is to render the
  placeholder as an inline React component, which would mean touching all 167
  call sites.

  Dark values mirror the app's dark surface tokens and match
  `/img/placeholder.svg`, so the two placeholders cannot drift apart.
-->
<style>
  .ph-bg    { fill: #eaeaea; }
  .ph-disc  { fill: #fafafa; }
  .ph-line  { stroke: #c9c9c9; }
  .ph-stop  { stop-color: #c9c9c9; }
  .ph-plate { fill: #ffffff; }
  .ph-icon  { fill: #666666; }

  @media (prefers-color-scheme: dark) {
    .ph-bg    { fill: #121820; }
    .ph-disc  { fill: #1a222c; }
    .ph-line  { stroke: #2b3646; }
    .ph-stop  { stop-color: #2b3646; }
    .ph-plate { fill: #232f3d; }
    .ph-icon  { fill: #6b7889; }
  }
</style>
