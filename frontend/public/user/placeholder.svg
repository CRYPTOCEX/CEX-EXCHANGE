<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Default avatar. Same constraint as img/placeholder.svg: loaded via <img>, so
    page tokens and `currentColor` cannot reach it and `prefers-color-scheme`
    (the OS setting, not the app's `.dark` class) is the only theme signal
    available. It was a light-only asset, so every missing avatar was a bright
    #f1f5f9 disc on dark surfaces. Dark values mirror the app's dark tokens.
  -->
  <style>
    .av-bg   { fill: #f1f5f9; }
    .av-fg   { fill: #cbd5e1; }
    .av-ring { stroke: #e2e8f0; }

    @media (prefers-color-scheme: dark) {
      .av-bg   { fill: #121820; }
      .av-fg   { fill: #3a4757; }
      .av-ring { stroke: #1e2733; }
    }
  </style>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" class="av-bg"/>

  <!-- User icon -->
  <g transform="translate(64,64)">
    <!-- Head -->
    <circle cx="0" cy="-12" r="18" class="av-fg"/>

    <!-- Body/Shoulders -->
    <path d="M -28 32 C -28 10 -20 2 0 2 C 20 2 28 10 28 32 L 28 32 L -28 32 Z" class="av-fg"/>
  </g>

  <!-- Subtle border -->
  <circle cx="64" cy="64" r="63" fill="none" class="av-ring" stroke-width="2"/>
</svg>
